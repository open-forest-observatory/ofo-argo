apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: register-field-trees-to-chm-workflow-
spec:
  entrypoint: main
  # Max concurrent projects to process in parallel. Edit this value directly to change.
  # (Argo doesn't support parameter substitution for integer fields like parallelism)
  parallelism: 18

  # Set imagePullPolicy for all containers in the workflow
  podSpecPatch: |
    containers:
      - name: main
        imagePullPolicy: Always

  # Affinity rules for workflow pods:
  # 1. nodeAffinity: Schedule on non-GPU nodes by default (GPU tasks override with affinity: {})
  # 2. podAffinity: Prefer nodes with other running workflow pods to minimize autoscaler evictions
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.present
                operator: DoesNotExist
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: workflows.argoproj.io/completed
                  operator: In
                  values:
                    - "false"
            topologyKey: kubernetes.io/hostname

  # A list of input parameters available to the workflow at runtime.
  # These parameters can be referenced throughout the workflow templates using {{workflow.parameters.<name>}}
  arguments:
    parameters:
      # The file on the mounted drive specifying the (drone mission, field plot) pairs to run on.
      # Field drone plots should be zero-padded to six places while the field plots should four.
      # This should be a .csv, with no column and one ofo_ground-reference_trees.gpkgline per pairing, ordered: drone mission id, field plot id.
      - name: DATASETS_FILE
      # Path to the file of ground reference trees for all plots, with a `plot_id` column
      - name: GROUND_REFERENCE_TREES_FILE
      # Path to the file of ground reference plot boundaries for all plots, with a `plot_id` column
      - name: GROUND_REFERENCE_PLOTS_FILE
      # Values of the registration ratio_quality_metric below this will count as plots which should
      # be automatically trusted. Pairings with values higher than this require manual assessment
      # and an image is saved out to support that.
      - name: RATIO_QUALITY_METRIC_THRESHOLD
        value: "0.4887"
      # The minimum height of a tree to use in registration
      - name: MIN_TREE_HEIGHT
        value: "5.0"
      # S3 bucket to obtain drone mission bounds metadata and CHM files from
      - name: S3_BUCKET_PUBLIC
        value: "ofo-public"
      # Which folder to use on S3
      - name: S3_DATA_FOLDER
        value: "drone/missions_03"
      # Which photogrammetry run to use
      - name: PHOTOGRAMMETRY_ID
        value: "photogrammetry_03"
      # All per-dataset temp products and outputs are saved under:
      # TEMP_FOLDER/{{workflow.name}}/{{dataset-name}}/
      - name: TEMP_FOLDER
        value: "/data/argo-output/temp-dir"
      # Image from tree-detection-and-matching repo to use.
      - name: TRAM_IMAGE_TAG
        value: "main"
      - name: S3_UPLOAD_PATH
        value: ofo-internal/species-project/registration

  # Defining where to read raw drone imagery data and write out imagery products to `/ofo-share`
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ceph-share-rw-pvc2

  templates:
    # The 'main' template determines datasets and fans out to process each in parallel.
    - name: main
      steps:
        - - name: determine-datasets
            template: determine-datasets
            arguments:
              parameters:
                - name: datasets-file
                  value: "{{workflow.parameters.DATASETS_FILE}}"
        - - name: process-datasets
            template: process-dataset-workflow
            arguments:
              parameters:
                - name: mission-id
                  value: "{{item.mission-id}}"
                - name: plot-id
                  value: "{{item.plot-id}}"
            # Continue processing remaining datasets even if one fails
            withParam: "{{steps.determine-datasets.outputs.result}}"

    - name: process-dataset-workflow
      inputs:
        parameters:
          - name: mission-id
          - name: plot-id
          # Per-pair working directory. All per-pair intermediate files are written under this.
          - name: pair-dir
            value: "{{workflow.parameters.TEMP_FOLDER}}/{{workflow.name}}/per-pair-data/{{inputs.parameters.mission-id}}_{{inputs.parameters.plot-id}}"
      dag:
        tasks:
          - name: prepare-ground-reference-data
            template: prepare-ground-reference-data
            arguments:
              parameters:
                - name: ground-plot-id
                  value: "{{inputs.parameters.plot-id}}"
                - name: ground-reference-trees-file
                  value: "{{workflow.parameters.GROUND_REFERENCE_TREES_FILE}}"
                - name: ground-reference-bounds-file
                  value: "{{workflow.parameters.GROUND_REFERENCE_PLOTS_FILE}}"
                - name: min-tree-height
                  value: "{{workflow.parameters.MIN_TREE_HEIGHT}}"
                - name: ground-reference-trees-output-file
                  value: "{{inputs.parameters.pair-dir}}/ground-reference-trees.gpkg"
                - name: ground-reference-bounds-output-file
                  value: "{{inputs.parameters.pair-dir}}/ground-reference-bounds.gpkg"
          - name: download-input-data
            template: download-input-data
            depends: "prepare-ground-reference-data.Succeeded"
            arguments:
              parameters:
                - name: mission-id
                  value: "{{inputs.parameters.mission-id}}"
                - name: s3-bucket
                  value: "{{workflow.parameters.S3_BUCKET_PUBLIC}}"
                - name: s3-data-folder
                  value: "{{workflow.parameters.S3_DATA_FOLDER}}"
                - name: local-dir
                  value: "{{inputs.parameters.pair-dir}}"
          - name: register-trees
            template: register-trees
            depends: "download-input-data.Succeeded"
            arguments:
              parameters:
                - name: input-trees-file
                  value: "{{tasks.prepare-ground-reference-data.outputs.parameters.ground-reference-trees-output-file}}"
                - name: CHM-file
                  value: '{{=jsonpath(tasks["download-input-data"].outputs.parameters["local-files"], "$.chm")}}'
                - name: min-tree-height
                  value: "{{workflow.parameters.MIN_TREE_HEIGHT}}"
                - name: output-shift-file
                  value: "{{inputs.parameters.pair-dir}}/{{inputs.parameters.mission-id}}_{{inputs.parameters.plot-id}}_shift.csv"
          - name: check-quality
            template: check-quality
            depends: register-trees.Succeeded
            arguments:
              parameters:
                - name: shift-file
                  value: "{{tasks.register-trees.outputs.parameters.shift-file}}"
          - name: save-visualization
            template: save-visualization
            depends: "check-quality.Succeeded"
            when: "{{tasks.check-quality.outputs.result}} > {{workflow.parameters.RATIO_QUALITY_METRIC_THRESHOLD}}"
            arguments:
              parameters:
                - name: input-trees-file
                  value: "{{tasks.prepare-ground-reference-data.outputs.parameters.ground-reference-trees-output-file}}"
                - name: input-bounds-file
                  value: "{{tasks.prepare-ground-reference-data.outputs.parameters.ground-reference-bounds-output-file}}"
                - name: CHM-file
                  value: '{{=jsonpath(tasks["download-input-data"].outputs.parameters["local-files"], "$.chm")}}'
                - name: shift-file
                  value: "{{tasks.register-trees.outputs.parameters.shift-file}}"
                - name: output-vis-file
                  value: "{{workflow.parameters.TEMP_FOLDER}}/{{workflow.name}}/shifts-to-validate/{{inputs.parameters.mission-id}}_{{inputs.parameters.plot-id}}.png"
          - name: upload-shift-file
            template: rclone-upload-template
            depends: "check-quality.Succeeded"
            when: "{{tasks.check-quality.outputs.result}} <= {{workflow.parameters.RATIO_QUALITY_METRIC_THRESHOLD}}"
            arguments:
              parameters:
                - name: plot-id
                  value: "{{inputs.parameters.plot-id}}"
                - name: mission-id
                  value: "{{inputs.parameters.mission-id}}"
                - name: temp-dir
                  value: "{{inputs.parameters.pair-dir}}"
                - name: shift-file
                  value: "{{inputs.parameters.pair-dir}}/{{inputs.parameters.mission-id}}_{{inputs.parameters.plot-id}}_shift.csv"

## Definitions of individual steps (templates)
    # Parses a .csv with drone_mission_id, plot_id columns (no header)
    # Returns a json list of dicts with "plot-id" and "mission-id" keys
    - name: determine-datasets
      inputs:
        parameters:
          - name: datasets-file
      nodeSelector:
        feature.node.kubernetes.io/workload-type: cpu
      script:
        image: python:3.9
        volumeMounts:
          - name: data
            mountPath: /data
        command: ["python3"]
        source: |
          import json, sys

          datasets = []
          # Track seen pairs so duplicate lines don't launch parallel jobs writing to the same directory
          seen = set()
          with open("{{inputs.parameters.datasets-file}}", "r") as f:
              for line in f:
                  line = line.strip()
                  if not line:
                      continue
                  drone_mission_id, ground_plot_id = [x.strip() for x in line.split(",")]
                  if (drone_mission_id, ground_plot_id) in seen:
                      continue
                  seen.add((drone_mission_id, ground_plot_id))
                  datasets.append({
                    "plot-id": ground_plot_id,
                    "mission-id": drone_mission_id,
                  })
          json.dump(datasets, sys.stdout)

    # This script takes in the full file of ground reference trees and plot bounds. It extracts the
    # appropriate subset of ground reference trees and plot bounds and writes them out.
    - name: prepare-ground-reference-data
      inputs:
        parameters:
          - name: ground-plot-id
          - name: ground-reference-trees-file
          - name: ground-reference-bounds-file
          - name: min-tree-height
          - name: ground-reference-trees-output-file
          - name: ground-reference-bounds-output-file
      outputs:
        parameters:
          - name: ground-reference-trees-output-file
            value: "{{inputs.parameters.ground-reference-trees-output-file}}"
          - name: ground-reference-bounds-output-file
            value: "{{inputs.parameters.ground-reference-bounds-output-file}}"
      nodeSelector:
        feature.node.kubernetes.io/workload-type: cpu
      script:
        image: ghcr.io/open-forest-observatory/tree-registration-and-matching:{{workflow.parameters.TRAM_IMAGE_TAG}}
        volumeMounts:
          - name: data
            mountPath: /data
        resources:
          requests:
            cpu: 1
            memory: "4Gi"
          limits:
            memory: "4Gi"
        command: ["python"]
        source: |
          from pathlib import Path

          from tree_registration_and_matching.entrypoints.register_trees_to_CHM import cleanup_field_trees

          import geopandas as gpd

          # Input variables
          ground_reference_plot_id = "{{inputs.parameters.ground-plot-id}}"
          ground_reference_trees_file = "{{inputs.parameters.ground-reference-trees-file}}"
          ground_reference_bounds_file = "{{inputs.parameters.ground-reference-bounds-file}}"
          ground_reference_trees_output_file = Path("{{inputs.parameters.ground-reference-trees-output-file}}")
          ground_reference_bounds_output_file = Path("{{inputs.parameters.ground-reference-bounds-output-file}}")
          min_tree_height = float("{{inputs.parameters.min-tree-height}}")

          # Read the other products, which contain the data for all plots
          ground_reference_trees = gpd.read_file(ground_reference_trees_file)
          ground_reference_bounds = gpd.read_file(ground_reference_bounds_file)

          # Subset to the specified plot
          # Compare as strings since the plot ID comes from the datasets file as text
          ground_reference_trees = ground_reference_trees[
              ground_reference_trees["plot_id"].astype(str) == ground_reference_plot_id
          ]
          ground_reference_bounds = ground_reference_bounds[
              ground_reference_bounds["plot_id"].astype(str) == ground_reference_plot_id
          ]

          # Impute height where needed and possible and drop remaining trees, also drop trees that
          # are below the height cutoff. This should match the preprocessing step in the registration
          # step but it is useful to do now for two reasons. First, this allows us to get an
          # accurate count of trees available for matching, to fail early if it's insufficient.
          # Second, it means that downstream tasks such as visualization and manual referencing
          # have access to only high quality trees with height values imputed.
          ground_reference_trees = cleanup_field_trees(ground_reference_trees, min_height=min_tree_height)

          # Fail early with a clear message if the plot is missing from either file or there aren't
          # enough trees retained
          if len(ground_reference_trees) < 2:
              raise ValueError(f"Not enough ground reference trees found for plot {ground_reference_plot_id}, only {len(ground_reference_trees)}, when two are required")
          if ground_reference_bounds.empty:
              raise ValueError(f"No ground reference bounds found for plot {ground_reference_plot_id}")

          # Save out the result
          ground_reference_trees_output_file.parent.mkdir(exist_ok=True, parents=True)
          ground_reference_bounds_output_file.parent.mkdir(exist_ok=True, parents=True)
          ground_reference_trees.to_file(ground_reference_trees_output_file)
          ground_reference_bounds.to_file(ground_reference_bounds_output_file)

    # Download photogrammetry products (for a single or composite mission) from S3 to the shared volume.
    # Returns a JSON dict of local file paths via outputs.parameters.local-files.
    # Keys: chm. Fails if any expected file is missing.
    # S3 source path: <s3-bucket>/<S3_DATA_FOLDER>/<mission-id>/full/<mission-id>
    - name: download-input-data
      inputs:
        parameters:
          - name: mission-id
          - name: s3-bucket
            value: "ofo-public"
          - name: s3-data-folder
            value: "{{workflow.parameters.S3_DATA_FOLDER}}"
          - name: local-dir
      outputs:
        parameters:
          - name: local-files
            valueFrom:
              path: /tmp/file-paths.json
      container:
        image: rclone/rclone:sha-7a53f24
        volumeMounts:
          - name: data
            mountPath: /data
        command: ["/bin/sh", "-lc"]
        args:
          - |
            set -euo pipefail
            MISSION_ID="{{inputs.parameters.mission-id}}"
            LOCAL_DIR="{{inputs.parameters.local-dir}}"
            S3_SRC="s3:{{inputs.parameters.s3-bucket}}/{{inputs.parameters.s3-data-folder}}/${MISSION_ID}/{{workflow.parameters.PHOTOGRAMMETRY_ID}}/full/"
            # TODO this could also be updated to include the tree top files
            INCLUDES="--include ${MISSION_ID}_chm-mesh.tif"

            mkdir -p "$LOCAL_DIR"

            echo "[rclone] Downloading $S3_SRC -> $LOCAL_DIR"
            rclone copy "$S3_SRC" "$LOCAL_DIR" $INCLUDES \
              --transfers 1 --checkers 1 --retries 5 --retries-sleep=15s \
              --stats 15s --stats-log-level NOTICE

            CHM_FILE="${LOCAL_DIR}/${MISSION_ID}_chm-mesh.tif"

            # Verify all expected files were downloaded
            if [ ! -f "$CHM_FILE" ]; then
              echo "[download] ERROR: Expected file not found: $CHM_FILE"
              exit 1
            fi
            echo "Verified CHM download"

            # Build JSON dict of downloaded file paths
            printf '{"chm":"%s"}' "$CHM_FILE" \
              > /tmp/file-paths.json

            echo "[download] File paths written to /tmp/file-paths.json"
        resources:
          requests:
            cpu: 1
            memory: "2Gi"
          limits:
            memory: "4Gi"
        env:
          - name: RCLONE_CONFIG_S3_TYPE
            value: "s3"
          - name: RCLONE_CONFIG_S3_PROVIDER
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: provider
          - name: RCLONE_CONFIG_S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: endpoint
          - name: RCLONE_CONFIG_S3_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: access_key
          - name: RCLONE_CONFIG_S3_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: secret_key


    - name: register-trees
      inputs:
        parameters:
          - name: input-trees-file
          - name: CHM-file
          - name: min-tree-height
          - name: output-shift-file
      outputs:
        parameters:
          - name: shift-file
            value: "{{inputs.parameters.output-shift-file}}"
      container:
        image: ghcr.io/open-forest-observatory/tree-registration-and-matching:{{workflow.parameters.TRAM_IMAGE_TAG}}
        volumeMounts:
          - name: data
            mountPath: /data
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
        command: [
                  "python",
                  "-m",
                  "tree_registration_and_matching.entrypoints.register_trees_to_CHM",
                  "--tree-points-file",
                  "{{inputs.parameters.input-trees-file}}",
                  "--CHM-file",
                  "{{inputs.parameters.CHM-file}}",
                  "--output-shift-summary",
                  "{{inputs.parameters.output-shift-file}}",
                  "--min-tree-height",
                  "{{inputs.parameters.min-tree-height}}",
                ]

    # Reads the single-row shift CSV written by register-trees and prints its ratio_quality_metric value.
    # The value is returned via stdout (outputs.result), so nothing else should be printed.
    - name: check-quality
      inputs:
        parameters:
          - name: shift-file
      nodeSelector:
        feature.node.kubernetes.io/workload-type: cpu
      script:
        image: python:3.9
        volumeMounts:
          - name: data
            mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: "128Mi"
          limits:
            memory: "128Mi"
        command: ["python3"]
        source: |
          import csv

          with open("{{inputs.parameters.shift-file}}", newline="") as f:
              row = next(csv.DictReader(f))

          # Parse as float so a malformed value fails here rather than in the downstream `when` expressions
          ratio_quality_metric = float(row["ratio_quality_metric"])

          # Fixed-point format: Python prints small floats in scientific notation (e.g. 1e-05), which the
          # downstream `when` expressions may not parse as a number
          print(f"{ratio_quality_metric:.6f}", end="")

    - name: save-visualization
      inputs:
        parameters:
          - name: input-trees-file
          - name: input-bounds-file
          - name: CHM-file
          - name: shift-file
          - name: output-vis-file
      container:
        image: ghcr.io/open-forest-observatory/tree-registration-and-matching:{{workflow.parameters.TRAM_IMAGE_TAG}}
        volumeMounts:
          - name: data
            mountPath: /data
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
        # TODO include the proper command once it is implemented
        command: [
            "python",
            "-m",
            "tree_registration_and_matching.entrypoints.plot_trees_on_raster",
            "--raster",
            "{{inputs.parameters.CHM-file}}",
            "--tree-points",
            "{{inputs.parameters.input-trees-file}}",
            "--plot-bounds",
            "{{inputs.parameters.input-bounds-file}}",
            "--shift-file",
            "{{inputs.parameters.shift-file}}",
            "--visualization-output-file",
            "{{inputs.parameters.output-vis-file}}"]

    # --------- RCLONE UPLOAD ---------
    # Uploads the two final output files to S3, then cleans up the local dataset directory.
    - name: rclone-upload-template
      inputs:
        parameters:
          - name: plot-id
          - name: mission-id
          - name: shift-file
          - name: temp-dir
      nodeSelector:
        feature.node.kubernetes.io/workload-type: cpu
      container:
        image: rclone/rclone:latest
        volumeMounts:
          - name: data
            mountPath: /data
        command: ["/bin/sh", "-lc"]
        args:
          - |
            set -euo pipefail
            SRC="{{inputs.parameters.shift-file}}"
            TEMP_DIR="{{inputs.parameters.temp-dir}}"
            DST="s3:{{workflow.parameters.S3_UPLOAD_PATH}}/{{inputs.parameters.mission-id}}/{{workflow.parameters.PHOTOGRAMMETRY_ID}}/ground-reference-shifts/{{inputs.parameters.mission-id}}_{{inputs.parameters.plot-id}}_ground-reference-shift.csv"

            echo "[rclone] Uploading selected files from $SRC -> $DST"
            rclone copyto "$SRC" "$DST" \
              --transfers 1 --checkers 1 --retries 5 --retries-sleep=15s \
              --s3-upload-cutoff 200Mi --s3-chunk-size 100Mi \
              --stats 15s --stats-log-level NOTICE

            echo "[rclone] Upload successful for plot ID: {{inputs.parameters.plot-id}}, mission ID: {{inputs.parameters.mission-id}}"

            echo "[cleanup] Removing local dataset directory: $TEMP_DIR"
            rm -rf "$TEMP_DIR"
            echo "[cleanup] Done"
        resources:
          requests:
            cpu: 500m
            memory: "256Mi"
          limits:
            memory: "1Gi"
        env:
          - name: RCLONE_CONFIG_S3_TYPE
            value: "s3"
          - name: RCLONE_CONFIG_S3_PROVIDER
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: provider
          - name: RCLONE_CONFIG_S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: endpoint
          - name: RCLONE_CONFIG_S3_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: access_key
          - name: RCLONE_CONFIG_S3_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: secret_key
