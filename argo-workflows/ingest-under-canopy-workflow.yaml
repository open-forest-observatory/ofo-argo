apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: ingest-under-canopy-workflow-
spec:
  serviceAccountName: argo
  entrypoint: main
  # Max concurrent missions to process in parallel. Edit this value directly to change.
  # (Argo doesn't support parameter substitution for integer fields like parallelism)
  parallelism: 10

  # Set imagePullPolicy for all containers in the workflow
  podSpecPatch: |
    containers:
      - name: main
        imagePullPolicy: Always

  # Affinity rules for workflow pods:
  # 1. nodeAffinity: Schedule on non-GPU nodes by default
  # 2. podAffinity: Prefer nodes with other running workflow pods to minimize autoscaler evictions
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.present
                operator: DoesNotExist
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: workflows.argoproj.io/completed
                  operator: In
                  values:
                    - "false"
            topologyKey: kubernetes.io/hostname

  arguments:
    parameters:
      # Path on the shared volume to a CSV with columns: ofo_mission_id, gopro_file_prefix
      # gopro_file_prefix may contain multiple comma-separated prefixes for a single mission.
      - name: MISSIONS_FILE
      # Folder of raw GoPro files to search (recursively) for each mission's images.
      - name: INPUT_DATA_FOLDER
        value: "/data/under-canopy-imagery-organization/0_raw"
      # Per-mission working directories (reorganized images + metadata, deleted after upload) are
      # created under: TEMP_FOLDER/{{workflow.name}}/{mission_id}/
      - name: TEMP_FOLDER
        value: "/data/argo-output/temp-dir"
      # S3 bucket and folder that outputs are uploaded to, via the 'js2s3' rclone remote.
      # Full paths:
      #   {S3_BUCKET}/{S3_BASE_FOLDER}/{mission_id}/{mission_id}_image-metadata.gpkg
      #   {S3_BUCKET}/{S3_BASE_FOLDER}/{mission_id}/{mission_id}_images.zip
      - name: S3_BUCKET
        value: "ofo-public"
      - name: S3_BASE_FOLDER
        value: "under-canopy"
      # ingest-data-under-canopy Docker image tag (built from ingest-data/under-canopy/Dockerfile)
      - name: INGEST_IMAGE_TAG
        value: "main"

  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ceph-share-rw-pvc2

  templates:
    # main: reads MISSIONS_FILE and fans out to one process-mission DAG per mission.
    - name: main
      dag:
        tasks:
          - name: determine-missions
            template: determine-missions
          - name: process-missions
            template: process-mission-workflow
            depends: "determine-missions.Succeeded"
            arguments:
              parameters:
                - name: ofo-mission-id
                  value: "{{item.ofo-mission-id}}"
                - name: mission-id-padded
                  value: "{{item.mission-id-padded}}"
                - name: gopro-file-prefix
                  value: "{{item.gopro-file-prefix}}"
            withParam: "{{tasks.determine-missions.outputs.result}}"

    # process-mission-workflow: DAG for a single mission. Reorganizes the raw images, extracts
    # metadata, zips and uploads the images, then cleans up the local working directory.
    - name: process-mission-workflow
      inputs:
        parameters:
          - name: ofo-mission-id
          - name: mission-id-padded
          - name: gopro-file-prefix
      dag:
        # failFast=false ensures other missions continue processing if this one fails
        failFast: false
        tasks:
          - name: reorganize
            template: reorganize
            arguments:
              parameters:
                - name: ofo-mission-id
                  value: "{{inputs.parameters.ofo-mission-id}}"
                - name: gopro-file-prefix
                  value: "{{inputs.parameters.gopro-file-prefix}}"

          - name: extract-metadata
            template: extract-metadata
            depends: "reorganize.Succeeded"
            arguments:
              parameters:
                - name: mission-id-padded
                  value: "{{inputs.parameters.mission-id-padded}}"

          - name: zip-and-upload
            template: zip-and-upload
            depends: "extract-metadata.Succeeded"
            arguments:
              parameters:
                - name: mission-id-padded
                  value: "{{inputs.parameters.mission-id-padded}}"

          - name: cleanup
            template: cleanup
            depends: "zip-and-upload.Succeeded"
            arguments:
              parameters:
                - name: mission-id-padded
                  value: "{{inputs.parameters.mission-id-padded}}"

## Definitions of individual steps (templates)

    # determine-missions: reads MISSIONS_FILE and emits a JSON array of
    # {ofo-mission-id, mission-id-padded, gopro-file-prefix} objects, one per CSV row.
    - name: determine-missions
      script:
        image: python:3.9
        volumeMounts:
          - name: data
            mountPath: /data
        resources:
          requests:
            cpu: 1
            memory: "1Gi"
          limits:
            memory: "2Gi"
        command: ["python"]
        source: |
          import csv
          import json
          import sys

          missions_file = "{{workflow.parameters.MISSIONS_FILE}}"

          with open(missions_file, "r") as f:
              missions = list(csv.DictReader(f))

          result = [
              {
                  "ofo-mission-id": row["ofo_mission_id"],
                  "mission-id-padded": f"{int(row['ofo_mission_id']):06d}",
                  "gopro-file-prefix": row["gopro_file_prefix"],
              }
              for row in missions
          ]

          json.dump(result, sys.stdout)

    # reorganize: hardlinks the raw images for one mission into
    # TEMP_FOLDER/{{workflow.name}}/{mission-id-padded}/, via 01_reorganize.py.
    - name: reorganize
      inputs:
        parameters:
          - name: ofo-mission-id
          - name: gopro-file-prefix
      container:
        image: ghcr.io/open-forest-observatory/ingest-data-under-canopy:{{workflow.parameters.INGEST_IMAGE_TAG}}
        volumeMounts:
          - name: data
            mountPath: /data
        resources:
          requests:
            cpu: 1
            memory: "2Gi"
          limits:
            memory: "4Gi"
        command: ["python", "01_reorganize.py"]
        args:
          - "{{workflow.parameters.INPUT_DATA_FOLDER}}"
          - "{{workflow.parameters.TEMP_FOLDER}}/{{workflow.name}}"
          - "--ofo-mission-id"
          - "{{inputs.parameters.ofo-mission-id}}"
          - "--gopro-file-prefix"
          - "{{inputs.parameters.gopro-file-prefix}}"

    # extract-metadata: builds the per-image metadata GeoPackage for one mission's reorganized
    # images, via 02_extract_metadata.py, and uploads it to S3.
    - name: extract-metadata
      inputs:
        parameters:
          - name: mission-id-padded
      container:
        image: ghcr.io/open-forest-observatory/ingest-data-under-canopy:{{workflow.parameters.INGEST_IMAGE_TAG}}
        volumeMounts:
          - name: data
            mountPath: /data
        resources:
          requests:
            cpu: 2
            memory: "4Gi"
          limits:
            memory: "8Gi"
        command: ["python", "02_extract_metadata.py"]
        args:
          - "{{workflow.parameters.TEMP_FOLDER}}/{{workflow.name}}/{{inputs.parameters.mission-id-padded}}"
          - "{{workflow.parameters.TEMP_FOLDER}}/{{workflow.name}}/{{inputs.parameters.mission-id-padded}}/{{inputs.parameters.mission-id-padded}}_image-metadata.gpkg"
          - "--s3-dest"
          - "{{workflow.parameters.S3_BUCKET}}/{{workflow.parameters.S3_BASE_FOLDER}}/{{inputs.parameters.mission-id-padded}}/{{inputs.parameters.mission-id-padded}}_image-metadata.gpkg"
        env:
          - name: RCLONE_CONFIG_JS2S3_TYPE
            value: "s3"
          - name: RCLONE_CONFIG_JS2S3_PROVIDER
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: provider
          - name: RCLONE_CONFIG_JS2S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: endpoint
          - name: RCLONE_CONFIG_JS2S3_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: access_key
          - name: RCLONE_CONFIG_JS2S3_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: secret_key

    # zip-and-upload: zips one mission's reorganized images and uploads the archive to S3, via
    # 03_zip_and_upload_images.py. The script deletes the local zip once the upload succeeds.
    - name: zip-and-upload
      inputs:
        parameters:
          - name: mission-id-padded
      container:
        image: ghcr.io/open-forest-observatory/ingest-data-under-canopy:{{workflow.parameters.INGEST_IMAGE_TAG}}
        volumeMounts:
          - name: data
            mountPath: /data
        resources:
          requests:
            cpu: 1
            memory: "2Gi"
          limits:
            memory: "4Gi"
        command: ["python", "03_zip_and_upload_images.py"]
        args:
          - "{{workflow.parameters.TEMP_FOLDER}}/{{workflow.name}}/{{inputs.parameters.mission-id-padded}}"
          - "{{workflow.parameters.TEMP_FOLDER}}/{{workflow.name}}/{{inputs.parameters.mission-id-padded}}_images.zip"
          - "--s3-dest"
          - "{{workflow.parameters.S3_BUCKET}}/{{workflow.parameters.S3_BASE_FOLDER}}/{{inputs.parameters.mission-id-padded}}/{{inputs.parameters.mission-id-padded}}_images.zip"
        env:
          - name: RCLONE_CONFIG_JS2S3_TYPE
            value: "s3"
          - name: RCLONE_CONFIG_JS2S3_PROVIDER
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: provider
          - name: RCLONE_CONFIG_JS2S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: endpoint
          - name: RCLONE_CONFIG_JS2S3_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: access_key
          - name: RCLONE_CONFIG_JS2S3_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: secret_key

    # cleanup: removes the mission's local working directory (reorganized images, filename
    # remapping, and metadata gpkg) now that both uploads have succeeded.
    - name: cleanup
      inputs:
        parameters:
          - name: mission-id-padded
      container:
        image: busybox
        volumeMounts:
          - name: data
            mountPath: /data
        resources:
          requests:
            cpu: 250m
            memory: "256Mi"
          limits:
            memory: "512Mi"
        command: ["/bin/sh", "-lc"]
        args:
          - |
            set -euo pipefail
            rm -rf "{{workflow.parameters.TEMP_FOLDER}}/{{workflow.name}}/{{inputs.parameters.mission-id-padded}}"
