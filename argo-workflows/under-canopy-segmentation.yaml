apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: under-canopy-segmentation-workflow-
spec:
  serviceAccountName: argo
  entrypoint: main
  # Max concurrent projects to process in parallel. Edit this value directly to change.
  # (Argo doesn't support parameter substitution for integer fields like parallelism)
  parallelism: 18

  # Set imagePullPolicy for all containers in the workflow
  podSpecPatch: |
    containers:
      - name: main
        imagePullPolicy: Always

  # Affinity rules for workflow pods:
  # 1. nodeAffinity: Schedule on non-GPU nodes by default (GPU tasks override with affinity: {})
  # 2. podAffinity: Prefer nodes with other running workflow pods to minimize autoscaler evictions
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.present
                operator: DoesNotExist
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: workflows.argoproj.io/completed
                  operator: In
                  values:
                    - "false"
            topologyKey: kubernetes.io/hostname

  # A list of input parameters available to the workflow at runtime.
  # These parameters can be referenced throughout the workflow templates using {{workflow.parameters.<name>}}
  arguments:
    parameters:
      # The newline separated list of collect_ids (zero-padded to six digits) to run on
      - name: COLLECT_LIST_FILE
      # The path to the model file (.pth) to run on
      - name: MODEL_PATH
        value: ""
      # The path to the model config file (.py) to run on
      - name: CONFIG_PATH
        value: ""
      # The path to S3 photogrammetry products, including both the bucket and folder
      - name: S3_PHOTOGRAMMETRY_FOLDER
        value: "ofo-internal/photogrammetry-outputs-under-canopy-imagery"
      # The path to S3 images, including both the bucket and the folder
      - name: S3_IMAGERY_FOLDER
        value: "ofo-public/under-canopy-imagery"
      # All per-dataset temp products and outputs are saved under:
      # TEMP_FOLDER/{{workflow.name}}/{{dataset-name}}/
      - name: TEMP_FOLDER
        value: "/data/argo-output/temp-dir"
      # The version of each Docker container to use
      - name: OFO_ARGO_UTILS_IMAGE_TAG
        value: "main"
      - name: GEOGRAYPHER_IMAGE_TAG
        value: "main"
      - name: MMSEGMENTATION_IMAGE_TAG
        value: "main"


  # Defining where to read raw drone imagery data and write out imagery products to `/ofo-share`
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ceph-share-rw-pvc2

  templates:
    # The 'main' template reads the datasets file and fans out to process each dataset in parallel.
    - name: main
      steps:
        - - name: determine-datasets
            template: determine-datasets
        - - name: process-datasets
            template: process-dataset-workflow
            arguments:
              parameters:
                - name: collect-id
                  value: "{{item}}"
            # Continue processing remaining datasets even if one fails
            withParam: "{{steps.determine-datasets.outputs.result}}"

    - name: process-dataset-workflow
      inputs:
        parameters:
          # The ID of collect, zero padded to six digits
          - name: collect-id
      dag:
        # failFast=false ensures other datasets continue if this one fails
        failFast: false
        tasks:
          - name: download-photogrammetry-data
            template: download-photogrammetry-data
            arguments:
              parameters:
                - name: collect-id
                  value: "{{inputs.parameters.collect-id}}"
                - name: s3-photogrammetry-folder
                  value: "{{workflow.parameters.S3_PHOTOGRAMMETRY_FOLDER}}"
                - name: local-folder
                  value: "{{workflow.parameters.TEMP_FOLDER}}/{{workflow.name}}/{{inputs.parameters.collect-id}}/photogrammetry-products"
          - name: download-imagery
            template: download-imagery
            arguments:
              parameters:
                # The imagery from each dataset is stored in a zip file with the structure
                # {s3 bucket}/{s3 imagery folder}/{collect_ID}/images/{collect_ID}_images.zip
                - name: imagery-zip-downloads
                  value: "[\"{{workflow.parameters.S3_IMAGERY_FOLDER}}/{{inputs.parameters.collect-id}}/images/{{inputs.parameters.collect-id}}_images.zip\"]"
                - name: download-folder
                  value: "{{workflow.parameters.TEMP_FOLDER}}/{{workflow.name}}/{{inputs.parameters.collect-id}}/imagery-downloads"
          - name: chip-images
            template: chip-images
            depends: "download-imagery.Succeeded"
            arguments:
              parameters:
                - name: collect-id
                  value: "{{inputs.parameters.collect-id}}"
                - name: image-folder
                  value: "{{tasks.download-imagery.outputs.parameters.output-folder}}"
          - name: segment-images
            template: segment-images
            depends: "chip-images.Succeeded"
            arguments:
              parameters:
                - name: collect-id
                  value: "{{inputs.parameters.collect-id}}"
                - name: config-path
                  value: "{{workflow.parameters.CONFIG_PATH}}"
                - name: model-path
                  value: "{{workflow.parameters.MODEL_PATH}}"
                - name: image-folder
                  value: "{{tasks.chip-images.outputs.parameters.output-folder}}"
          - name: project-segmentations
            template: project-segmentations
            depends: "segment-images.Succeeded & download-photogrammetry-data.Succeeded"
            arguments:
              parameters:
                - name: collect-id
                  value: "{{inputs.parameters.collect-id}}"
                - name: mesh-file
                  value: '{{=jsonpath(tasks["download-photogrammetry-data"].outputs.parameters["local-files"], "$.mesh")}}'
                - name: mesh-metadata-file
                  value: '{{=jsonpath(tasks["download-photogrammetry-data"].outputs.parameters["local-files"], "$.mesh_metadata_file")}}'
                - name: cameras-file
                  value: '{{=jsonpath(tasks["download-photogrammetry-data"].outputs.parameters["local-files"], "$.cameras")}}'
                - name: image-folder
                  value: "{{tasks.download-imagery.outputs.parameters.output-folder}}"
                - name: label-folder
                  value: "{{tasks.segment-images.outputs.parameters.output-folder}}"
                - name: original-image-folder
                  value: '{{=jsonpath(tasks["download-photogrammetry-data"].outputs.parameters["local-files"], "$.photogrammetry_download_root")}}'
                - name: predicted-face-classes-savefile
                  value: "{{workflow.parameters.TEMP_FOLDER}}/{{workflow.name}}/{{inputs.parameters.collect-id}}/predicted_face_classes.npy"



# Definitions of individual steps (templates)
    # Parse the newline-separated datasets file into a JSON array of dataset names
    - name: determine-datasets
      script:
        image: python:3.9
        volumeMounts:
          - name: data
            mountPath: /data
        command: ["python3"]
        source: |
          import json, sys
          with open("{{workflow.parameters.COLLECT_LIST_FILE}}", "r") as f:
              datasets = [line.strip() for line in f if line.strip()]
          json.dump(datasets, sys.stdout)
    # Download under canopy photogrammetry products from S3. Note that these products are in a single
    # flat folder and have not yet been post-processed as have the drone data.
    # Returns a JSON dict of local file paths via outputs.parameters.local-files.
    # Keys: camera, mesh, mesh-metadata. Fails if any expected file is missing.
    - name: download-photogrammetry-data
      inputs:
        parameters:
          - name: collect-id
          - name: s3-photogrammetry-folder
          - name: local-folder
      outputs:
        parameters:
          - name: local-files
            valueFrom:
              path: /tmp/file-paths.json
      container:
        image: rclone/rclone:sha-7a53f24
        volumeMounts:
          - name: data
            mountPath: /data
        env:
          - name: RCLONE_CONFIG_S3_TYPE
            value: "s3"
          - name: RCLONE_CONFIG_S3_PROVIDER
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: provider
          - name: RCLONE_CONFIG_S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: endpoint
          - name: RCLONE_CONFIG_S3_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: access_key
          - name: RCLONE_CONFIG_S3_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: secret_key
        command: ["/bin/sh", "-lc"]
        args:
          - |
            set -euo pipefail
            COLLECT_ID="{{inputs.parameters.collect-id}}"
            LOCAL_FOLDER="{{inputs.parameters.local-folder}}"
            S3_SRC="s3:{{inputs.parameters.s3-photogrammetry-folder}}"
            # TODO consider including the DTM, which is not currently computed
            INCLUDES="--include ${COLLECT_ID}_cameras.xml --include ${COLLECT_ID}_mesh.ply --include ${COLLECT_ID}_mesh-metadata.xml --include ${COLLECT_ID}_log.txt"

            mkdir -p "$LOCAL_FOLDER"

            echo "[rclone] Downloading $S3_SRC -> $LOCAL_FOLDER"
            rclone copy "$S3_SRC" "$LOCAL_FOLDER" $INCLUDES \
              --transfers 8 --checkers 8 --retries 5 --retries-sleep=15s \
              --stats 15s --stats-log-level NOTICE

            CAMERAS_FILE="${LOCAL_FOLDER}/${COLLECT_ID}_cameras.xml"
            MESH_FILE="${LOCAL_FOLDER}/${COLLECT_ID}_mesh.ply"
            MESH_METADATA_FILE="${LOCAL_FOLDER}/${COLLECT_ID}_mesh-metadata.xml"
            LOG_FILE="${LOCAL_FOLDER}/${COLLECT_ID}_log.txt"

            # Verify all expected files were downloaded
            for f in "$CAMERAS_FILE" "$MESH_FILE" "$MESH_METADATA_FILE" "$LOG_FILE"; do
              if [ ! -f "$f" ]; then
                echo "[download] ERROR: Expected file not found: $f"
                exit 1
              fi
            done
            echo "[download] All 4 expected files verified."

            # --- Determine the folder where images was located when photogrammetry was run ---
            # Photogrammetry exports a camera file which includes absolute paths to the images.
            # These are based on where the images were located for the photogrammetry processing
            # workflow. We must extract this initial path so it can be replaced with one that is
            # appropriate for this workflow.
            # The log's "photo_path" list (under the "project:" key) holds the raw-imagery paths used
            # when photogrammetry was run, of the form
            # "{root}/${PROCESSED_DRONE_DATASET_ID}/photogrammetry/downloaded-raw-imagery/...". Read
            # the config as YAML (list items only start capturing right after the "  photo_path:" key,
            # so this can't be confused with the other "- " lists in the file, e.g. lower_offset_folders)
            # and take the portion of its first entry before the processed-drone-dataset-id path segment.
            FIRST_PHOTO_PATH=$(awk '
              /^  photo_path:$/ { capture=1; next }
              capture && /^  - / { sub(/^  - /, ""); print; exit }
              capture { exit }
            ' "$LOG_FILE")
            if [ -z "$FIRST_PHOTO_PATH" ]; then
              echo "[download] ERROR: Could not parse photo_path from log file: $LOG_FILE"
              exit 1
            fi
            PHOTOGRAMMETRY_DOWNLOAD_ROOT="${FIRST_PHOTO_PATH%%downloaded-raw-imagery/*}downloaded-raw-imagery"
            if [ "$PHOTOGRAMMETRY_DOWNLOAD_ROOT" = "$FIRST_PHOTO_PATH" ]; then
              echo "[download] ERROR: 'downloaded-raw-imagery' not found in photo_path: $FIRST_PHOTO_PATH"
              exit 1
            fi
            echo "[download] Parsed photogrammetry download root: $PHOTOGRAMMETRY_DOWNLOAD_ROOT"

            # Build JSON dict of downloaded file paths
            printf '{"cameras":"%s","mesh":"%s","mesh_metadata_file":"%s", "photogrammetry_download_root":"%s"}' \
              "$CAMERAS_FILE" "$MESH_FILE" "$MESH_METADATA_FILE" "$PHOTOGRAMMETRY_DOWNLOAD_ROOT" \
              > /tmp/file-paths.json

            echo "[download] File paths written to /tmp/file-paths.json"
        resources:
          requests:
            cpu: 1
            memory: "2Gi"
          limits:
            memory: "4Gi"

    - name: download-imagery
      inputs:
        parameters:
          - name: imagery-zip-downloads
          - name: download-folder
      container:
        image: ghcr.io/open-forest-observatory/argo-workflow-utils:{{workflow.parameters.OFO_ARGO_UTILS_IMAGE_TAG}}
        volumeMounts:
          - name: data
            mountPath: /data
        command: ["python3", "/app/download_imagery.py"]
        env:
          - name: IMAGERY_ZIP_URLS
            value: "{{inputs.parameters.imagery-zip-downloads}}"
          - name: DOWNLOAD_DIR
            value: "{{inputs.parameters.download-folder}}"
          - name: S3_PROVIDER
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: provider
          - name: S3_ENDPOINT
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: endpoint
          - name: S3_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: access_key
          - name: S3_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: s3-credentials
                key: secret_key
        resources:
          requests:
            cpu: "2"
            memory: "2Gi"
      outputs:
        parameters:
          - name: output-folder
            value: "{{inputs.parameters.download-folder}}"

    - name: chip-images
      inputs:
        parameters:
          - name: collect-id
          - name: image-folder
          - name: output-folder
            value: "{{workflow.parameters.TEMP_FOLDER}}/{{workflow.name}}/{{inputs.parameters.collect-id}}/chipped"
      container:
        image: ghcr.io/open-forest-observatory/geograypher:{{workflow.parameters.GEOGRAYPHER_IMAGE_TAG}}
        volumeMounts:
          - name: data
            mountPath: /data
        resources:
          requests:
            cpu: 2
            memory: "14Gi"
          limits:
            memory: "14Gi"
        command: [
                  "python",
                  "-m",
                  "geograypher.entrypoints.equirectangular_to_cube_mapped",
                  "{{inputs.parameters.image-folder}}",
                  "{{inputs.parameters.output-folder}}"
                ]
      outputs:
        parameters:
          - name: output-folder
            value: "{{inputs.parameters.output-folder}}"

    - name: segment-images
      inputs:
        parameters:
          - name: collect-id
          - name: config-path
          - name: model-path
          - name: image-folder
          - name: output-folder
            value: "{{workflow.parameters.TEMP_FOLDER}}/{{workflow.name}}/{{inputs.parameters.collect-id}}/segmented"
      affinity: {}
      container:
        image: ghcr.io/open-forest-observatory/mmsegmentation:{{workflow.parameters.MMSEGMENTATION_IMAGE_TAG}}
        volumeMounts:
          - name: data
            mountPath: /data
        resources:
          requests:
            nvidia.com/gpu: 1
        command: [
                  "python",
                  "/mmsegmentation/tools/inference.py",
                  "{{inputs.parameters.config-path}}",
                  "{{inputs.parameters.model-path}}",
                  "{{inputs.parameters.image-folder}}",
                  "{{inputs.parameters.output-folder}}",
                ]
      outputs:
        parameters:
          - name: output-folder
            value: "{{inputs.parameters.output-folder}}"

    - name: project-segmentations
      inputs:
        parameters:
          - name: collect-id
          - name: mesh-file
          - name: mesh-metadata-file
          - name: cameras-file
          - name: image-folder
          - name: label-folder
          - name: original-image-folder
          - name: predicted-face-classes-savefile
      container:
        image: ghcr.io/open-forest-observatory/geograypher:{{workflow.parameters.GEOGRAYPHER_IMAGE_TAG}}
        volumeMounts:
          - name: data
            mountPath: /data
        resources:
          requests:
            cpu: 2
            memory: "8Gi"
          limits:
            memory: "8Gi"
        command: [
                  "python",
                  "-m",
                  "geograypher.entrypoints.aggregate_images",
                  "--mesh-file",
                  "{{inputs.parameters.mesh-file}}",
                  "--mesh-metadata-file",
                  "{{inputs.parameters.mesh-metadata-file}}",
                  "--cameras-file",
                  "{{inputs.parameters.cameras-file}}",
                  "--image-folder",
                  "{{inputs.parameters.image-folder}}",
                  "--label-folder",
                  "{{inputs.parameters.label-folder}}",
                  "--original-image-folder",
                  "{{inputs.parameters.original-image-folder}}",
                  "--predicted-face-classes-savefile",
                  "{{inputs.parameters.predicted-face-classes-savefile}}",
                ]
      outputs:
        parameters:
          - name: predicted-face-classes-savefile
            value: "{{inputs.parameters.predicted-face-classes-savefile}}"