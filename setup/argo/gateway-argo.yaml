# Purpose: Expose the Argo UI at https://argo.focal-lab.org through Envoy Gateway (Gateway API).
#
# - Envoy terminates public HTTPS with a Let's Encrypt certificate. cert-manager creates and renews
#   it automatically because of the issuer annotation on the Gateway (stored in the
#   argo-gateway-tls Secret; this is the gateway's public certificate, not argo-server's own).
# - HTTP (port 80) redirects to HTTPS, except Let's Encrypt HTTP-01 challenges, which cert-manager
#   routes on the same listener (more specific path, so it takes precedence over the redirect).
# - Envoy re-encrypts to argo-server, which serves HTTPS with its default self-signed certificate.
#   That certificate can't be verified, so verification is skipped (Envoy Gateway's Backend API,
#   enabled at install with config.envoyGateway.extensionApis.enableBackend=true). Traffic inside
#   the cluster stays encrypted.
#
# Requires: Envoy Gateway and cert-manager installed as in docs/admin/argo-installation-on-cluster.md,
# and setup/argo/issuer-letsencrypt.yaml applied.
#
# argo.focal-lab.org is the default hostname. The install doc applies this file through a sed that
# substitutes $ARGO_HOSTNAME (e.g. argo3.focal-lab.org for a new cluster during a migration).

apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: argo-gateway
  namespace: argo
  annotations:
    cert-manager.io/issuer: letsencrypt-prod
spec:
  gatewayClassName: eg
  listeners:
  - name: http
    hostname: argo.focal-lab.org
    port: 80
    protocol: HTTP
  - name: https
    hostname: argo.focal-lab.org
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: argo-gateway-tls
---
# argo-server's in-cluster HTTPS endpoint, with verification of its self-signed cert skipped.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: argo-server
  namespace: argo
spec:
  endpoints:
  - fqdn:
      hostname: argo-server.argo.svc.cluster.local
      port: 2746
  tls:
    insecureSkipVerify: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-server
  namespace: argo
spec:
  parentRefs:
  - name: argo-gateway
    sectionName: https
  hostnames:
  - argo.focal-lab.org
  rules:
  - backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: argo-server
    # The UI streams workflow updates and logs over long-lived connections; don't cut them off.
    timeouts:
      request: "0s"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-http-to-https
  namespace: argo
spec:
  parentRefs:
  - name: argo-gateway
    sectionName: http
  hostnames:
  - argo.focal-lab.org
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
